<style>

<script>
'use strict';
const get = id => document.getElementById(id);
const canvas = get('scene');
const ctx = canvas.getContext('2d');
const editor = get('editor');
const data = JSON.parse(get('birthday-data').textContent);
const originalPage = '<!doctype html>\n' + document.documentElement.outerHTML;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const palette = ['#f0a8ce','#bf9ce6','#adccff','#ecc2ad','#aaa4c6','#eab1bf','#a3d4d6'];
const tau = Math.PI * 2;
const mix = (a,b,t) => a+(b-a)*t;
const clamp = (n,a,b) => Math.min(b,Math.max(a,n));
let seed = 109;
function random(){
  seed = (Math.imul(1664525, seed) + 1013904223) >>> 0;
  return seed / 4294967296;
}
const dust = Array.from({length:94},()=>[random(),random(),random()]);
const objects = [];
function burstPath(){
  return {angle:random()*tau, distance:.39+Math.sqrt(random())*.61,
    speed:.78+random()*.82, bend:(random()-.5)*.48, trail:random()>.44};
}
function add(kind,x,y,z,r,color){
  objects.push({kind,x,y,z,r,color});
}
// Two staggered outer rows build each tier's sides. Smaller balls fill the exposed top.
const tiers=[
  {radius:144,bottom:145,top:108,outer:17,cap:12,size:25},
  {radius:98,bottom:36,top:-2,outer:13,cap:9,size:22},
  {radius:62,bottom:-60,top:-97,outer:10,cap:7,size:19}
];
const accents=['#ed818f','#79c9ed','#ffbd76','#b4dfbf','#8fa9fa'];
let secretPlanet;
let accentIndex=0;
for(const [tierIndex,tier] of tiers.entries()){
  for(const [row,count] of [tier.outer,tier.outer,tier.cap].entries()){
    const ringCount=row===2?count-1:count;
    const sizes=Array.from({length:count},(_,i)=>{
      if(row===2)return tier.size*(i===count-1?.9:[.43,.78,.56,1.03][(i+tierIndex)%4]);
      const scale=[1.39,.55,.91,1.15,.66,.82,.48,1.25][(i+row*3+tierIndex*2)%8];
      return tier.size*scale*(.96+random()*.08);
    });
    // Share the circumference by neighboring diameters so large and small orbs can touch.
    const gaps=sizes.slice(0,ringCount).map((size,i)=>size+sizes[(i+1)%ringCount]);
    const total=gaps.reduce((sum,gap)=>sum+gap,0);
    let arc=0;
    for(let i=0;i<count;i++){
      const center=row===2&&i===count-1;
      const angle=(arc/total+.083*row+.023*tierIndex)*tau;
      arc+=gaps[i]||0;
      const size=sizes[i];
      const edgeInset=row===2?0:(size-tier.size)*.33;
      const distance=center?0:tier.radius*(row===2?.53:1)-edgeInset+(random()-.5)*8;
      const secondBurst=row===2&&i%2===0;
      const color=secondBurst?accents[accentIndex++%accents.length]:palette[(i+2*row+tierIndex)%palette.length];
      const planet=row===1&&i===(tierIndex===0?3: tierIndex===1?5:7);
      add(planet?'planet':'orb',Math.cos(angle)*distance,
        (row===0?tier.bottom+(.9*tier.size-size)*.55:tier.top)+(random()-.5)*10,Math.sin(angle)*distance,size,color);
      const ball=objects[objects.length-1];
      ball.secondBurst=secondBurst;
      if(planet&&tierIndex===0)secretPlanet=ball;
    }
  }
}
add('star',38,118,157,17,'#ffe0a0');
add('star',-33,12,118,15,'#ffe2a2');
add('star',-48,-79,58,13,'#ffe2a2');
add('crystal',-104,122,114,30,'#e3c7fb');
add('crystal',84,31,75,27,'#eed4ff');
for(const o of objects) o.flight=burstPath();
const photoFlights=Array.from({length:6},burstPath);
let photoObjects = [];
function refreshPhotos(){
  const slots=[[-114,55,119],[115,52,119],[-76,-41,85],[76,-43,85],[-88,122,141],[89,121,141]];
  photoObjects=data.photos.map((photo,i)=>{
    const image = new Image();
    image.src = photo.src;
    const [x,y,z] = slots[i];
    return {kind:'photo',x,y,z,r:24,image,i,flight:photoFlights[i]};
  });
  get('photos').replaceChildren(...data.photos.map((photo,i)=>{
    const li=document.createElement('li');
    const img=new Image(); img.src=photo.src; img.alt='';
    const name=document.createElement('span'); name.textContent=photo.name;
    const button=document.createElement('button'); button.textContent='移除';
    button.setAttribute('aria-label','移除 '+photo.name);
    button.onclick=()=>{data.photos.splice(i,1);refreshPhotos();};
    li.append(img,name,button);
    return li;
  }));
}
refreshPhotos();
const wish=get('wish');
const wishInput=get('wish-input');
const letterInput=get('letter-input');
const nameInput=get('name-input');
const fireworkButton=get('firework-button');
const fireworkName=get('firework-name');
nameInput.value=data.celebrant||'';
data.candleWishes??={};
const candles=[
  {word:'health',color:'#96e4b9',blessing:'愿你睡得香，醒来有精神。'},
  {word:'love',color:'#ff9ebf',blessing:'愿你自在地去爱，也被真心珍惜。'},
  {word:'money',color:'#ffce79',blessing:'愿你的努力都有回报，也有余裕做喜欢的事。'},
  {word:'brave',color:'#9bbdff',blessing:'愿你害怕的时候，也有勇气迈出一步。'},
  {word:'beautiful',color:'#d3a6fc',blessing:'愿你每次照镜子，都喜欢眼前的自己。'}
].map(({word,color,blessing},i)=>{
  const label=document.createElement('label');
  label.className='candle-wish-row';
  const name=document.createElement('span');
  name.textContent=word;name.style.color=color;
  const input=document.createElement('input');
  input.type='text';input.maxLength=80;input.placeholder=blessing;
  input.value=data.candleWishes[word]||'';
  input.oninput=()=>{data.candleWishes[word]=input.value.trim();};
  label.append(name,input);
  get('candle-wish-fields').append(label);
  const [x,z]=[[-54,4],[-30,33],[0,-29],[30,33],[54,4]][i];
  const button=document.createElement('button');
  button.type='button';
  button.className='scene-target candle-target';
  button.setAttribute('aria-label','吹灭 '+word+' 蜡烛');
  button.title=word;
  get('candle-targets').append(button);
  const surface=objects.reduce((top,ball)=>{
    if(ball.y>-82||(ball.kind!=='orb'&&ball.kind!=='planet'))return top;
    const distance=Math.hypot(ball.x-x,ball.z-z);
    if(distance>=ball.r)return top;
    return Math.min(top,ball.y-Math.sqrt(ball.r**2-distance**2));
  },-98);
  return {word,color,blessing,button,x,z,footY:surface+8,height:76+[0,7,13,5,2][i],outAt:Infinity};
});
const planetTarget=get('planet-target');
const wishConfirmation=get('wish-confirmation');
const letterDialog=get('letter-dialog');
letterInput.value=data.letter||'';
wishInput.value=data.wish||'';
wish.textContent=wishInput.value;
let W,H,dpr,S,cx,cy,anchor,topEdge,wishSpace;
function resize(){
  W=canvas.clientWidth; H=canvas.clientHeight;
  dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  topEdge=document.querySelector('h1').getBoundingClientRect().bottom;
  wishSpace=wish.textContent?Math.min(wish.offsetHeight+15,Math.max(0,H*.22)):0;
  const available=H-topEdge-60-wishSpace;
  S=Math.min(W/451,available/555,1.4);
  S=Math.max(.06,S); cx=W/2;
  cy=topEdge+17+(available-555*S)/2+303*S;
  anchor=cy-194*S;
  fireworkName.style.top=Math.max(topEdge+52,cy-90*S)+'px';
  wishConfirmation.style.left=cx+'px';
  wishConfirmation.style.top=Math.max(topEdge+13,cy-272*S)+'px';
}
new ResizeObserver(resize).observe(canvas); resize();
function poly(points){
  ctx.beginPath(); points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();
}
function fade(hex,alpha){return hex+Math.round(alpha*255).toString(16).padStart(2,'0');}
function ring(r,front){
  ctx.save();ctx.rotate(-.34);ctx.shadowBlur=12;ctx.shadowColor='#ffba60';
  ctx.strokeStyle='#fff0c4';ctx.lineWidth=Math.max(1,r*.09);ctx.beginPath();
  ctx.ellipse(0,0,r*1.52,r*.38,0,front?0:Math.PI,front?Math.PI:tau);ctx.stroke();ctx.restore();
}
function orb(r,color,planet){
  if(planet) ring(r,false);
  const g=ctx.createRadialGradient(-r*.33,-r*.41,r*.02,0,0,r);
  g.addColorStop(0,'#fff7fd');g.addColorStop(.16,fade(color,.98));
  g.addColorStop(.53,fade(color,.76));g.addColorStop(.82,fade(color,.48));
  g.addColorStop(1,fade(color,.97));
  ctx.beginPath();ctx.arc(0,0,r,0,tau);ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='#ffffff36';ctx.lineWidth=.8;ctx.stroke();
  ctx.save();ctx.rotate(-.64);
  const shine=ctx.createRadialGradient(-r*.08,-r*.64,0,-r*.08,-r*.64,r*.31);
  shine.addColorStop(0,'#fffefde0');shine.addColorStop(1,'#fffefd00');
  ctx.fillStyle=shine;ctx.beginPath();ctx.ellipse(-r*.08,-r*.64,r*.31,r*.15,0,0,tau);ctx.fill();ctx.restore();
  if(planet) ring(r,true);
}
function star(r){
  poly(Array.from({length:10},(_,i)=>{
    const a=i*Math.PI/5-Math.PI/2, q=i%2?r*.49:r;
    return [Math.cos(a)*q,Math.sin(a)*q];
  }));
  ctx.shadowColor='#ffbd68';ctx.shadowBlur=15;
  const g=ctx.createLinearGradient(0,-r,0,r);g.addColorStop(0,'#fff9d9');g.addColorStop(1,'#ffc179');ctx.fillStyle=g;ctx.fill();
}
function crystal(r){
  for(const [dx,angle,scale] of [[-.31,-.49,.66],[.27,.49,.68],[0,-.14,1]]){
    ctx.save();ctx.translate(dx*r,r*.59);ctx.rotate(angle);ctx.scale(r*scale,r*scale);
    poly([[-.23,0],[-.3,-1.12],[0,-1.67],[.29,-1.1],[.15,0]]);
    const g=ctx.createLinearGradient(-.3,0,.29,0);g.addColorStop(0,'#d9c5ff70');g.addColorStop(.47,'#fff3ff');g.addColorStop(1,'#a688e989');
    ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#fff0fada';ctx.lineWidth=.025;ctx.stroke();
    poly([[0,-1.67],[.29,-1.1],[.15,0],[.04,-1.04]]);
    ctx.fillStyle='#e2acdf84';ctx.fill();ctx.restore();
  }
}
function photoCard(o,r){
  if(!o.image.complete||!o.image.naturalWidth) return;
  ctx.rotate(o.i%2?.12:-.12);
  ctx.shadowColor='#f7b8e590';ctx.shadowBlur=12;
  ctx.fillStyle='#ffe5f4';ctx.beginPath();ctx.roundRect(-r,-r,r*2,r*2.13,r*.14);ctx.fill();
  ctx.shadowBlur=0;
  const dim=Math.min(o.image.naturalWidth,o.image.naturalHeight);
  ctx.drawImage(o.image,(o.image.naturalWidth-dim)/2,(o.image.naturalHeight-dim)/2,dim,dim,-r*.87,-r*.87,r*1.74,r*1.74);
}
const restPitch=-.20;
let yaw=0,pitch=restPitch,targetYaw=0,targetPitch=restPitch,offsetX=0,offsetY=0,scattered=false,progress=0,drag;
let candlePose;
function scenePose(){
  return {cos:Math.cos(yaw),sin:Math.sin(yaw),cp:Math.cos(pitch),sp:Math.sin(pitch),offsetX,offsetY};
}
function project(x,y,z,pose){
  const sideways=x*pose.cos+z*pose.sin;
  const forward=z*pose.cos-x*pose.sin;
  const vertical=y*pose.cp-forward*pose.sp;
  const depth=y*pose.sp+forward*pose.cp;
  const scale=S*730/(730-depth);
  return {x:cx+sideways*scale+pose.offsetX,y:cy+vertical*scale+pose.offsetY,depth,scale};
}
let secondProgress=0, openedAt=-Infinity, returnedAt=-Infinity;
const secondBurstDelay=240;
const returnShimmerDelay=590;
const introStartedAt=performance.now();
const introGlowAt=210;
const introFireworkAt=1390;
const fireworkDuration=1750;
let introFinished=false;
function introLight(elapsed,y){
  const tier=y>49?0:y>-53?1:2;
  const fadeIn=clamp((elapsed-introGlowAt-145-tier*215)/410,0,1);
  return .24+.76*fadeIn*fadeIn*(3-2*fadeIn);
}
let blownAt=Infinity;
let lastCandle=null;
const constellationShape=[[-1,.82],[-.56,.34],[-.08,.05],[.44,.27],[1,.68]];
const starTravel=760;
const candleWishDelay=reduced?0:320;
const candleWishDuration=2800;
const musicTargets=get('music-targets');
const melodyButton=get('melody-button');

function updateMelodyGuide(){
  if(melodyStep<0){
    melodyButton.textContent='跟我弹';
    melodyAnnouncement.textContent='';
  }else if(melodyStep===birthdayMelody.length){
    melodyButton.textContent='再弹一次';
    melodyAnnouncement.textContent='生日旋律完成';
  }else{
    melodyButton.textContent='跟弹 '+(melodyStep+1)+'/'+birthdayMelody.length;
    melodyAnnouncement.textContent='下一颗音符球 '+noteLetters[birthdayMelody[melodyStep]];
  }
  for(const planet of musicPlanets.values()){
    if(birthdayMelody[melodyStep]===planet.index)planet.button.setAttribute('aria-current','step');
    else planet.button.removeAttribute('aria-current');
  }
}
melodyButton.onclick=()=>{

let musicAudio;
async function playMusicNote(frequency,delay=0,volume=1){
  const Audio=window.AudioContext||window.webkitAudioContext;
  if(!Audio)return;
  try{
    musicAudio??=new Audio();
    if(musicAudio.state==='suspended')await musicAudio.resume();
    const start=musicAudio.currentTime+delay;
    for(const [ratio,level,decay] of [[1,.13,.62],[2,.036,.37],[3.01,.017,.22]]){
      const tone=musicAudio.createOscillator();
      const envelope=musicAudio.createGain();
      tone.frequency.value=frequency*ratio;
      envelope.gain.setValueAtTime(.0001,start);
      envelope.gain.exponentialRampToValueAtTime(level*volume,start+.014);
      envelope.gain.exponentialRampToValueAtTime(.0001,start+decay);
      tone.connect(envelope);envelope.connect(musicAudio.destination);
      tone.start(start);tone.stop(start+decay+.02);
    }
  }catch{
    // The visual response remains available when the browser blocks sound.
  }
}

  }));

function drawObjects(t,introElapsed=Infinity,blowElapsed=-Infinity){

    const {x:originX,y:originY,depth,scale}=project(o.x,o.y,o.z,pose);
    const radius=o.r*scale;
    const flight=o.flight;
    const speed=o.kind==='photo'?.69:o.r<20?flight.speed*1.16:flight.speed*.9;
    const firstWave=1-Math.pow(1-progress,speed);
    const spread=o.secondBurst?firstWave*.31+secondProgress*.69:firstWave;
    const music=musicPlanets.get(o);
    const scatteredRadius=music?clamp(W*.041,13,24):Math.min(radius*.86,W/14,H/19);
    const r=mix(radius,scatteredRadius,spread);
    const margin=Math.max(14,r*1.6+9);
    const safeTop=Math.min(H-margin,topEdge+margin);
    const safeBottom=Math.max(safeTop,H-margin-20);

    function position(amount){

      const reach=flight.distance*(o.r<20?1:.93);
      const vx=Math.cos(angle), vy=Math.sin(angle);
      const edge=1/Math.max(Math.abs(vx),Math.abs(vy));

  planetTarget.style.height=Math.max(44,hiddenPlanet.r*2.1)+'px';

}
function stardust(now){
  const elapsed=now-returnedAt-returnShimmerDelay;
  if(reduced||scattered||elapsed<0||elapsed>540)return;
  const phase=elapsed/540;
  const pose=scenePose();
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(const o of objects){
    if(o.kind!=='orb'||o.r>=19)continue;
    const height=clamp((144-o.y)/270,0,1);
    const strength=Math.max(0,1-Math.abs(height-phase)*5);
    if(!strength)continue;
    const {x:px,y:py,scale}=project(o.x,o.y,o.z,pose);
    const size=(3+o.r*.34)*scale;
    ctx.globalAlpha=strength;
    const glow=ctx.createRadialGradient(px,py,0,px,py,size*2.6);
    glow.addColorStop(0,'#fff4cf');glow.addColorStop(.3,'#ffcf8f95');glow.addColorStop(1,'#ffbd6b00');
    ctx.fillStyle=glow;
    ctx.fillRect(px-size*2.6,py-size*2.6,size*5.2,size*5.2);
  }
  ctx.restore();
}

function constellationPoints(now){

    const elapsed=now-entry.outAt-candleWishDelay;

      x:mix(entry.starOrigin.x*W,cx+dx*width,easing),

  });

  if(release)launchCelebration(now,strength);
}

let previous=performance.now();
function frame(now){
  const dt=Math.min(50,now-previous);previous=now;
  const t=now/1000;
  const follow=1-Math.exp(-dt/92);
  yaw=mix(yaw,targetYaw,follow);pitch=mix(pitch,targetPitch,follow);
  offsetX=mix(offsetX,clamp(targetYaw,-.56,.56)*15,follow);offsetY=mix(offsetY,targetPitch*17,follow);
  const desired=scattered?1:0;
  progress=reduced?desired:mix(progress,desired,1-Math.exp(-dt/(scattered?128:127)));
  const secondTarget=scattered&&now-openedAt>=secondBurstDelay?1:0;
  secondProgress=reduced?desired:mix(secondProgress,secondTarget,1-Math.exp(-dt/(scattered?88:84)));
  const encore=heartPhase(850+(now-melodyFinishedAt)*1.65);
  const heartTarget=scattered?Math.max(heartPhase(now-openedAt),encore):0;
  heartAmount=reduced?(heartTarget>.5?1:0):mix(heartAmount,heartTarget,1-Math.exp(-dt/62));
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  for(const [x,y,q] of dust){
    ctx.fillStyle='rgba(249,208,234,'+(.08+q*.29)+')';
    ctx.beginPath();ctx.arc(x*W,y*H,.35+q*.95,0,tau);ctx.fill();
  }
  ctx.save();ctx.translate(cx,cy+206*S);ctx.scale(1,.23);
  const pool=ctx.createRadialGradient(0,0,0,0,0,201*S);
  pool.addColorStop(0,'#faba9d48');pool.addColorStop(.44,'#de8ebe24');pool.addColorStop(1,'#de8ebe00');
  ctx.fillStyle=pool;ctx.fillRect(-201*S,-201*S,402*S,402*S);ctx.restore();
  const elapsed=reduced||introFinished?Infinity:now-introStartedAt;
  const blowElapsed=now-blownAt;
  drawObjects(t,elapsed,blowElapsed);stardust(now);fireworks(now);drawCandles(t,elapsed,now);drawConstellation(now);drawCelebration(now);
  const wishAge=lastCandle?now-lastCandle.outAt-candleWishDelay:-1;
  let message='';
  if(wishAge>=0&&wishAge<candleWishDuration){
    message=data.candleWishes[lastCandle.word]||lastCandle.blessing;
  }else if(Number.isFinite(blownAt)&&wishAge>=candleWishDuration&&wishAge<candleWishDuration+3000){
    message='愿望已经收到';
  }
  if(wishConfirmation.textContent!==message)wishConfirmation.textContent=message;
  wishConfirmation.hidden=!message;
  updateWish(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
for(const entry of candles){
  entry.button.onclick=()=>{
    if(Number.isFinite(entry.outAt))return;
    entry.outAt=performance.now();
    const pose=candlePose||scenePose();
    const tip=project(entry.x,entry.footY-entry.height,entry.z,pose);
    entry.starOrigin=entry.flameOrigin||{x:tip.x/W,y:(tip.y-24*tip.scale)/H};
    lastCandle=entry;
    entry.button.setAttribute('aria-disabled','true');
    entry.button.setAttribute('aria-label',entry.word+' 蜡烛已熄灭');
    introFinished=true;
    if(candles.every(candle=>Number.isFinite(candle.outAt))){
      blownAt=entry.outAt;
      if(!scattered)get('hint').textContent='轻点散开 · 拖动旋转';
    }
  };
}
planetTarget.onclick=()=>{
  if(planetTarget.hidden||!scattered)return;

  letterDialog.showModal();
};
function toggle(){
  introFinished=true;
  if(scattered){
    planetTarget.hidden=true;
    musicTargets.hidden=true;
    melodyStep=-1;
    melodyFinishedAt=-Infinity;
    updateMelodyGuide();
  }
  scattered=!scattered;
  canvas.setAttribute('aria-pressed',scattered);
  get('hint').textContent=scattered?'点音符球弹奏 · 点空白处聚拢':'轻点散开 · 拖动旋转'+(Number.isFinite(blownAt)?'':' · 点蜡烛许愿');
  const now=performance.now();
  if(scattered){
    candlePose=scenePose();
    targetYaw=yaw;
    targetPitch=pitch;
    wish.dataset.visible=false;
    openedAt=now;
    if(burstAt>now&&returnedAt>0)burstAt=-Infinity;
  }else{
    candlePose=null;
    returnedAt=now;
    burstAt=now+returnShimmerDelay+350;
  }
}
canvas.addEventListener('pointerdown',e=>{
  if(!e.isPrimary||e.button!==0)return;
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,yaw:targetYaw,pitch:targetPitch,moved:false};
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
  if(!e.isPrimary)return;
  if(drag&&drag.id===e.pointerId){
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(Math.hypot(dx,dy)>8)drag.moved=true;
    if(drag.moved&&!scattered){
      targetYaw=drag.yaw+dx*.009;targetPitch=clamp(drag.pitch-dy*.0035,-.42,-.10);
    }
  }else if(e.pointerType==='mouse'&&!scattered){
    targetYaw=(e.clientX/W-.5)*.92;targetPitch=restPitch+(.5-e.clientY/H)*.19;
  }
});
canvas.addEventListener('pointerup',e=>{
  if(!drag||drag.id!==e.pointerId)return;
  const tapped=!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<=8;
  drag=null;if(tapped)toggle();
});
canvas.addEventListener('lostpointercapture',()=>drag=null);
canvas.addEventListener('pointerleave',e=>{if(!drag&&!scattered&&e.pointerType==='mouse'){targetYaw=0;targetPitch=restPitch;}});
canvas.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(!e.repeat)toggle();}});

const status=get('status');
const picker=get('files');
const exportButton=get('export');
function resizePhoto(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      try{
        const scale=Math.min(1,1000/Math.max(img.naturalWidth,img.naturalHeight));
        const buffer=document.createElement('canvas');
        buffer.width=Math.max(1,Math.round(img.naturalWidth*scale));
        buffer.height=Math.max(1,Math.round(img.naturalHeight*scale));
        const surface=buffer.getContext('2d');
        surface.fillStyle='#201628';surface.fillRect(0,0,buffer.width,buffer.height);
        surface.drawImage(img,0,0,buffer.width,buffer.height);
        resolve({name:file.name,src:buffer.toDataURL('image/jpeg',.86)});
      }catch(error){reject(error);}
      finally{URL.revokeObjectURL(url);}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('无法读取图片'));};
    img.src=url;
  });
}
picker.onchange=async()=>{
  const files=[...picker.files];
  const remaining=6-data.photos.length;
  picker.disabled=exportButton.disabled=true;
  status.textContent='正在读取照片…';
  try{
    const results=await Promise.allSettled(files.slice(0,remaining).map(resizePhoto));
    const added=results.filter(r=>r.status==='fulfilled').map(r=>r.value);
    data.photos.push(...added);refreshPhotos();
    status.textContent='已添加 '+added.length+' 张。'+(results.length>added.length?' 部分图片无法读取。':'')+(files.length>remaining?' 最多保留 6 张。':'');
  }finally{
    picker.value='';picker.disabled=exportButton.disabled=false;
  }
};
exportButton.onclick=()=>{
  const payload=JSON.stringify(data).replace(/</g,'\\u003c');
  const html=originalPage.replace(/(<script id="birthday-data" type="application\/json">)[\s\S]*?(<\/script>)/,(_,start,end)=>start+payload+end);
  const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
  const link=document.createElement('a');link.href=url;link.download='index.html';link.click();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
  status.textContent='已生成 index.html，内含当前年龄和照片。';
};
